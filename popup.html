<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eclyzer Hub</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header class="brand">
    <img src="icons/icon-48.png" width="36" height="36" alt="">
    <h1>Eclyzer Hub</h1>
  </header>
  <main>
    <div id="featured"></div>
    <section aria-labelledby="tools-title">
      <h2 id="tools-title">Aplikasi &amp; layanan</h2>
      <ul id="tools"></ul>
    </section>
  </main>
  <template id="shortcut">
    <a class="shortcut" target="_blank" rel="noopener noreferrer">
      <span class="shortcut-icon" aria-hidden="true"></span>
      <span class="shortcut-copy">
        <strong></strong>
        <span class="shortcut-detail"></span>
      </span>
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 18 18 6M8 6h10v10"/>
      </svg>
    </a>
  </template>
</body>
</html>
